<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hotel Hurricane Guest App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Heebo:wght@300;400;500;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#0E2238;--bg:#F5F2EA;--sand:#F2C27B;--gold:#11528F;--lsand:#BFD9EE;--paper:#FFFFFF;--warm:#C4623B;--ice:#2C8AC4;--mut:rgba(14,34,56,.62);--line:rgba(17,82,143,.2);--c:"Heebo",system-ui,sans-serif;--f:"Poppins",system-ui,sans-serif;--s:1}
html,body{height:100%}
body{font-family:var(--c);background:#E3E3D9;color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
.top{height:62px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--ink);color:#fff}
.top img{height:36px;display:block}
.top small{font-size:13.5px;color:rgba(255,255,255,.6)}
.sp{flex:1}
.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:5px 12px;font-weight:600}
.tag.hot{background:var(--sand);color:var(--ink);border-color:var(--sand);font-weight:700}
.tag[aria-pressed=true]{background:#fff;color:var(--ink)}
.layout{display:grid;grid-template-columns:236px 1fr 340px;height:calc(100% - 62px)}
body[data-notes=off] .layout{grid-template-columns:236px 1fr 0}body[data-notes=off] .notes{display:none}
.rail{padding:22px 16px;overflow:auto;border-right:1px solid rgba(17,82,143,.22);background:#ECEFEA}
.rg{margin-bottom:20px}.rg .eb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);padding:0 10px 8px;font-weight:700}
.ri{display:flex;gap:11px;align-items:center;width:100%;padding:9px 10px;border-radius:10px;font-size:15.5px;font-weight:500;color:#324960}
.ri .n{font-size:12px;color:#8fa0b0;width:18px;font-variant-numeric:tabular-nums}
.ri:hover{background:rgba(14,34,56,.05)}
.ri[aria-current=true]{background:var(--ink);color:#fff}.ri[aria-current=true] .n{color:rgba(255,255,255,.55)}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(900px 620px at 50% 38%,#FFFFFF,#E6E8E2)}
.pw{width:calc(390px*var(--s));height:calc(844px*var(--s));position:relative;flex:none}
.phone{width:390px;height:844px;border-radius:56px;position:absolute;top:0;left:0;transform-origin:0 0;transform:scale(var(--s));background:#000;box-shadow:0 0 0 10px #0b1b2d,0 0 0 11.5px var(--sand),0 60px 90px -25px rgba(14,34,56,.55)}
.screen{position:absolute;inset:0;border-radius:56px;overflow:hidden;background:var(--bg);color:var(--ink);isolation:isolate}
.hint{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:14px;color:#5c6f82}
.hint button{border:1.5px solid var(--ink);border-radius:99px;padding:5px 14px;font-size:14px;font-weight:600;background:#fff}.hint button:disabled{opacity:.3}
.notes{padding:26px 26px 20px;overflow:auto;border-left:1px solid rgba(17,82,143,.22);background:#ECEFEA}
.notes .eb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.notes h2{font-family:var(--f);font-weight:300;font-size:27px;margin:6px 0 8px;line-height:1.15;letter-spacing:-.015em}
.notes p.l{font-size:15px;line-height:1.55;color:#41566b}
.notes ul{margin:14px 0 0 18px;font-size:14.5px;line-height:1.55;color:#142a41}.notes li{margin-bottom:8px}
.why{margin-top:18px;padding:14px 16px;border-radius:14px;background:#fff;border:1px solid var(--sand);box-shadow:3px 3px 0 var(--lsand)}
.why p{font-size:14.5px;line-height:1.5;margin-top:4px}
.foot{font-size:12.5px;line-height:1.55;color:#7b8ea0;margin-top:20px}
.sbar{position:absolute;top:0;left:0;right:0;height:56px;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:8px 36px 0 40px;font-weight:600;font-size:16px;pointer-events:none;color:var(--ink);transition:color .3s}
.screen[data-th=dark] .sbar{color:#fff}
.sbar i{display:inline-block;width:17px;height:11px;border-radius:3px;border:1.5px solid currentColor;margin-left:6px;position:relative;opacity:.9}
.sbar i:after{content:"";position:absolute;inset:1.5px;background:currentColor;border-radius:1px;width:60%}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;border-radius:22px;background:#000;z-index:70;transition:width .55s cubic-bezier(.2,.9,.25,1.05),height .55s cubic-bezier(.2,.9,.25,1.05);overflow:hidden;cursor:pointer;color:#fff}
.island .in{opacity:0;transition:opacity .25s;display:flex;align-items:center;gap:12px;padding:13px 18px;white-space:nowrap}
.island.open{width:358px;height:80px;border-radius:40px}.island.open .in{opacity:1;transition-delay:.2s}
.island .ico{width:42px;height:42px;border-radius:50%;background:var(--sand);color:var(--ink);display:grid;place-items:center;flex:none}
.island b{font-size:16px;font-weight:700;display:block}.island span.s{font-size:13px;color:rgba(255,255,255,.62)}
.island .t{margin-left:auto;font-family:var(--f);font-weight:300;font-size:20px;color:var(--lsand)}
.view{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateY(16px) scale(.985);transition:opacity .4s,transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s .4s;background:var(--bg)}
.view.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.view.dk{background:var(--ink);color:#fff}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:64px 0 132px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 20px}
.rv{opacity:0}.on .rv{animation:up .75s both cubic-bezier(.2,.8,.2,1);animation-delay:calc(var(--d,0)*65ms + 100ms)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.hd{font-family:var(--f);font-weight:300;letter-spacing:-.02em;line-height:1.12}
.hd b{font-weight:600}
.h2{font-family:var(--f);font-weight:300;font-size:21px;line-height:1.15;letter-spacing:-.01em}
.h2 b{font-weight:600}
.h3{font-weight:700;font-size:16px;line-height:1.2}
.m{font-size:13.5px;color:var(--mut);line-height:1.45}
.p{font-size:15.5px;line-height:1.55}
.stk{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:var(--sand);color:var(--ink);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.stk.d{background:var(--ink);color:#fff}.stk.w{background:rgba(255,255,255,.92);color:var(--ink)}.stk.o{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1px var(--sand)}.stk.gl{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(8px)}.stk.warm{background:var(--warm);color:#fff}.stk.ice{background:var(--ice);color:#06222c}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;position:relative;overflow:hidden;box-shadow:0 14px 30px -22px rgba(14,34,56,.5)}
.ph{background-size:cover;background-position:center;background-color:#c5d3de;position:relative}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,22,38,.42) 0%,rgba(8,22,38,0) 34%,rgba(8,22,38,.12) 55%,rgba(8,22,38,.88) 100%)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:56px;border-radius:99px;font-family:var(--c);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;transition:transform .15s;background:var(--ink);color:#fff}
.btn:active{transform:scale(.97)}
.btn.sand{background:var(--sand);color:var(--ink)}.btn.w{background:#fff;color:var(--ink)}.btn.o{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--sand)}.btn.sm{height:46px;font-size:12px}.btn.warm{background:var(--warm);color:#fff}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);backdrop-filter:blur(8px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px var(--sand);white-space:nowrap;background:transparent;transition:all .2s}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:none}
.chip:disabled{opacity:.3}
.row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:0 20px;scroll-snap-type:x proximity}.row::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:14px;right:14px;bottom:18px;height:72px;border-radius:36px;z-index:50;display:flex;align-items:center;justify-content:space-around;padding:0 10px;background:rgba(14,34,56,.8);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 18px 36px -10px rgba(8,22,38,.6),inset 0 0 0 1px rgba(191,217,238,.3);transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.screen[data-tb=off] .tabbar{transform:translateY(130px);opacity:0;pointer-events:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--c);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);padding:8px 8px;min-width:56px;transition:color .2s}
.tab[aria-current=true]{color:var(--lsand)}
.tab.kf{width:64px;height:64px;min-width:64px;border-radius:50%;background:linear-gradient(135deg,#d9ecf8,#7FB6DD 60%,#11528F);color:var(--ink);margin-top:-30px;border:4px solid var(--bg);justify-content:center;box-shadow:0 10px 24px -6px rgba(17,82,143,.8);padding:0}
.bar{display:flex;align-items:center;gap:12px;padding:0 20px 14px}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:#fff;color:var(--ink);box-shadow:0 4px 14px -4px rgba(14,34,56,.4)}
.back.glass{background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.dk .back{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:24px;padding:16px;position:relative;overflow:hidden;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:1px solid var(--line);background:var(--paper)}
.big{font-family:var(--f);font-weight:300;font-size:38px;letter-spacing:-.01em;line-height:.95}.big small{font-size:.38em;letter-spacing:0;margin-left:3px;color:var(--mut);font-weight:400}
.pulse{width:9px;height:9px;border-radius:50%;background:#3DBE86;position:relative;display:inline-block;flex:none}
.pulse:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid #3DBE86;animation:pl 1.8s infinite}
@keyframes pl{from{transform:scale(.4);opacity:1}to{transform:scale(1.7);opacity:0}}
.mq{overflow:hidden;white-space:nowrap;font-family:var(--c);font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:11px}
.mq div{display:inline-block;animation:mq 30s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:55;border-radius:30px 30px 0 0;padding:10px 20px 32px;transform:translateY(105%);transition:transform .6s cubic-bezier(.2,.85,.25,1);background:var(--paper);box-shadow:0 -24px 50px rgba(8,22,38,.45);color:var(--ink);max-height:92%;overflow-y:auto;scrollbar-width:none}
.sheet.on{transform:none}.sheet .grab{width:48px;height:5px;border-radius:3px;background:var(--sand);margin:0 auto 16px}
.scrim{position:absolute;inset:0;z-index:54;background:rgba(8,22,38,.5);opacity:0;pointer-events:none;transition:opacity .4s}.scrim.on{opacity:1;pointer-events:auto}
.stepper{display:flex;align-items:center;gap:14px}.stepper button{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--sand);font-size:22px;font-weight:500;display:grid;place-items:center}
.stepper b{font-family:var(--f);font-size:32px;font-weight:300;min-width:26px;text-align:center}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;gap:14px}.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;font-weight:700}
.msg{max-width:84%;padding:11px 16px;border-radius:20px;font-size:15.5px;line-height:1.45;animation:up .5s both}
.msg.in{background:#fff;border-bottom-left-radius:6px;align-self:flex-start;box-shadow:0 4px 14px -8px rgba(14,34,56,.5)}
.msg.out{background:var(--ink);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg small{display:block;font-size:11.5px;opacity:.5;margin-top:5px}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.msg .acts button{font-size:13.5px;font-weight:700;padding:7px 14px;border-radius:99px;background:var(--sand)}
.typing{display:flex;gap:4px;padding:15px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.4;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.2}30%{opacity:.9}}
.toast{position:absolute;left:50%;bottom:116px;transform:translate(-50%,20px);z-index:80;padding:12px 20px;border-radius:99px;font-size:14.5px;font-weight:600;opacity:0;transition:all .4s cubic-bezier(.2,.8,.2,1);white-space:nowrap;background:var(--ink);color:#fff;box-shadow:0 0 0 1.5px var(--sand)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.kenb{position:absolute;inset:-6%;background-size:cover;background-position:50% 50%;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.16) translate(-2%,-1%)}}
.keybtn{position:relative;width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,#d9ecf8,#7FB6DD 55%,#11528F);color:var(--ink);display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .2s,background .3s;flex:none;box-shadow:0 10px 24px -8px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.3)}
.keybtn:active{transform:scale(.95)}.keybtn.ok{background:#2f9e6c;color:#fff}
.keybtn svg.rg{position:absolute;inset:-12px;width:136px;height:136px;transform:rotate(-90deg)}
.keybtn .rp{position:absolute;inset:0;border-radius:50%;border:2px solid #fff;opacity:0}.keybtn.ok .rp{animation:rip 1.2s infinite}
@keyframes rip{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
.chk{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--sand);display:grid;place-items:center;flex:none;transition:all .25s;color:transparent;background:#fff}
.chk.on{background:var(--ink);color:var(--lsand);box-shadow:none}
.seg{display:flex;background:#EAEBE2;border-radius:99px;padding:4px;gap:2px}.seg button{flex:1;text-align:center;padding:9px 6px;border-radius:99px;font-weight:700;font-size:13.5px;transition:all .2s;color:var(--mut)}.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.toggle{width:52px;height:30px;border-radius:99px;background:rgba(14,34,56,.2);position:relative;transition:background .25s;flex:none}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.toggle[aria-pressed=true]{background:#2f9e6c}.toggle[aria-pressed=true]:after{transform:translateX(22px)}
.pass{background:linear-gradient(160deg,#17324d,var(--ink) 60%,#0a1a2b);color:#fff;border-radius:30px;position:relative;box-shadow:0 22px 40px -18px rgba(14,34,56,.85)}
.pass:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,var(--sand),#dfe7ee,var(--sand));border-radius:30px 30px 0 0}
.perf{position:relative;height:0;border-top:2px dashed rgba(255,255,255,.25);margin:0 22px}
.perf:before,.perf:after{content:"";position:absolute;top:-15px;width:28px;height:28px;border-radius:50%;background:var(--bg)}
.perf:before{left:-36px}.perf:after{right:-36px}
.fld .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;font-weight:700}.fld .v{font-family:var(--f);font-weight:500;font-size:19px;margin-top:2px}
.gl{backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.heat{display:flex;gap:5px}.heat i{width:28px;height:8px;border-radius:4px;background:rgba(255,255,255,.2);transition:background .5s}.heat i.on{background:linear-gradient(90deg,#f0b46a,var(--warm))}
.heat.ice i.on{background:linear-gradient(90deg,#bfe6f2,var(--ice))}
.vapor{position:absolute;left:0;right:0;bottom:0;height:60%;background:radial-gradient(60% 80% at 30% 100%,rgba(255,255,255,.25),transparent),radial-gradient(50% 70% at 75% 100%,rgba(255,255,255,.2),transparent);animation:vp 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes vp{from{transform:translateY(8%) scale(1);opacity:.6}to{transform:translateY(-6%) scale(1.15);opacity:1}}
.breath{position:relative;width:250px;height:250px;margin:0 auto;display:grid;place-items:center}
.breath .o,.breath .m2,.breath .c{position:absolute;border-radius:50%}
.breath .o{inset:0;border:1.5px solid rgba(255,255,255,.35)}
.breath .m2{inset:30px;border:1px solid rgba(255,255,255,.2)}
.breath .c{width:120px;height:120px;background:radial-gradient(circle at 35% 30%,#e8edf0,var(--sand) 65%,#7e7050);box-shadow:0 0 60px rgba(191,217,238,.55);transition:transform 4s cubic-bezier(.45,0,.55,1)}
.breath.in .c{transform:scale(1.75)}.breath.hold .c{transform:scale(1.75);transition-duration:.2s}.breath.out .c{transform:scale(1);transition-duration:8s}
@media(max-width:1080px){.layout{grid-template-columns:200px 1fr 0}.notes{display:none}}
@media(max-width:760px){.layout{grid-template-columns:1fr}.rail{display:none}.top small,.top .tag:not(.hot){display:none}.top{padding:0 14px}}

welcome:["Arrival","Welcome","Hotel Hurricane, the four-star family hotel on Tarifa beach with views over the Strait of Gibraltar to Morocco, in its own colours: whitewash, palms and Atlantic blue.",["Real: the logo, the slogan (&lsquo;More than a hotel, a way of life&rsquo;), the 1986 opening, and every photo come from hotelhurricane.com.","A ticker with the facts guests pick the hotel for: family-run since 1986, two pools, gym, sauna and hammam, restaurant and beach bar, EV charging, a Natural Park location.","The site is published in Spanish, English, German and French; the app would follow the guest&rsquo;s language."],"The first screen should sell the place and give one clear next step, not ask for a login."],
home:["Arrival","Today & key card","Arrival day as a key card with a hold-to-unlock button (try it), then the wind, tonight&rsquo;s table and the plan.",["Real: 24-hour reception, check-in from 15:00, breakfast included, and the hotel&rsquo;s own beach webcam (it has a Webcam entry in its menu).","Room number, guest, weather and the wind figure are placeholders. The stay (27 to 30 November 2026) sits inside the published low season, and a Friday to Monday stay meets the usual two-night weekend minimum.","The pill at the top is a Live Activity for tonight&rsquo;s table (tap it)."],"In Tarifa the day is decided by the wind. Today puts the wind, the key and the next thing to do on one screen, so the front desk answers less of the same question."],
room:["Arrival","Room & upgrades","A Beach Double/Twin with the key on the phone, and the next categories up with their real published rates.",["Real: the five room types (Mountain, Beach, Superior, Family, Luxury) and their 2026 low-season rates: &euro;130, &euro;172, &euro;193, &euro;272 and &euro;318. The upgrade differences (+&euro;21, +&euro;100, +&euro;146 a night) are calculated from them.","Real: minibar, safe, air conditioning, central heating, TV and a balcony, terrace or garden in every room; towels, bathrobe and slippers, room service 09:00 to 23:00, and the pet policy (&euro;30 a day, &euro;200 deposit).","Assumed: the site does not say whether a rate is per room per night, so the sheet says to confirm with the hotel. Room number and the key are placeholders."],"A guest who can open the door, order room service and see the next category up with a price, without calling, is a guest who books the bigger room next time."],
wind:["Wind & sea","Wind & water planner","Drag the wind and watch the strait change, then see what suits the day.",["Real: Tarifa is Europe&rsquo;s best-known spot for kitesurfing and windsurfing, and the site says days with little wind are perfect for paddle-surf or kayaking. Mountain biking, climbing and hiking in the natural parks are on the same page.","Illustrative: the forecast and the knot ranges are rules of thumb. A live version would read a forecast feed and show the hotel&rsquo;s beach webcam.","Concept: the site lists the sports Tarifa offers but not hotel lessons, so requests go to the concierge, who would pass them to a partner school the hotel chooses."],"Wind decides every guest&rsquo;s day here. Answering &lsquo;what do we do today?&rsquo; in the app sends guests to the gym, the hammam and the day trips on the windy days, instead of to the front desk."],
dine:["Eat & restore","Restaurant & beach bar","Restaurant Hurricane, the Beach Bar, the sister hotel&rsquo;s El Jard&iacute;n and breakfast, with a booking sheet.",["Real: breakfast 08:00 to 11:00 (included); Beach Bar 12:00 to 20:00 with lunch 13:00 to 16:00, self-service, no reservation; the restaurant&rsquo;s dinner 20:00 to 23:00; room service 09:00 to 23:00.","Real: more than 70 salad recipes at the Beach Bar, a grill with swordfish, Tarifa tuna, entrec&ocirc;te and burgers, home-made chips, local and organic produce, &lsquo;Agua km 0&rsquo; in returnable bottles; pets only on the Beach Bar terraces.","Note: the hotel&rsquo;s services guide gives dinner as 19:30 to 22:30 and the restaurant page as 20:00 to 23:00; the app would show one. Table times are illustrative."],"Tables are requested through a web form today. One tap with a confirmed status gives the guest an answer and the team fewer messages."],
well:["Eat & restore","Gym & wellness","The gym, the sauna and hammam, two pools, classes and treatments, with a booking sheet.",["Real: a fully equipped gym, a personal training plan on request, yoga, Pilates and stretching classes, a ping-pong table, a Finnish sauna, an oriental hammam, massages, osteopathy and &lsquo;painless&rsquo; therapy sessions by certified experts; the wellness area is open 09:00 to 20:00.","Real: two pools, the main pool for everyone (with a shallow area for children) and the smaller gym pool for adults only; towels are one per person with a daily exchange, and &euro;20 is charged for each one not returned.","Illustrative: class and treatment times and names; the site publishes no timetable or price list."],"The wellness area is one of the reasons guests come back. Booking it from the phone, especially on windy days, fills classes and treatment slots that sit empty today."],
trips:["Wind & sea","Day trips","From the hotel to Tarifa, the white villages, the natural parks and the cities, with a request to the concierge.",["Real: Tarifa is 14 km from Morocco; the old town and the Roman ruins of Baelo Claudia; the white villages of the mountains; the cities of Cadiz, Jerez and Malaga in a day; and the two natural parks, Parque Natural del Estrecho and Los Alcornocales.","Real: the hotel lists a shuttle and transfer service, bicycle rental and parking among its services.","The map is a schematic, not to scale; drive times are left out on purpose. A live version would calculate them."],"Guests ask the same &lsquo;what is there to see?&rsquo; questions at the desk. A plan, a transfer request and a route in the app is the answer the team gives anyway, without the queue."],
hotel:["Stay","Hotel guide","The services, the pools and gardens, the policies and the sustainability work, from the hotel&rsquo;s own services guide.",["Real: 24-hour reception, Wi-Fi, parking, EV charging (since summer 2022), bicycle rental, shuttle and transfer, laundry with 24-hour return, luggage storage, cots and baby changing, bathrobe and slippers on request.","Real: a 25% deposit; free cancellation up to 15 days before arrival; a pet rate of &euro;30 a day with a &euro;200 deposit; the ANDANATURA Natural Park quality seal, solar panels and &lsquo;Agua km 0&rsquo;.","The sister hotel is Hotel Punta Sur, at km 77 of the same road (Hurricane is at km 78); its restaurant, El Jard&iacute;n, is on the dining screen."],"The services guide is a long page today. As tiles with a request button, the same information becomes something guests use and the team can count."],
chat:["Stay","Concierge chat","An answer bot built on the hotel&rsquo;s own guest information, with the team behind it.",["Try &lsquo;dogs&rsquo;, &lsquo;breakfast&rsquo;, &lsquo;beach bar&rsquo;, &lsquo;wind&rsquo;, &lsquo;ev charging&rsquo; or &lsquo;wellness&rsquo;.","Answers use the real hours and policies from the website.","Anything else goes to the team: +34 956 68 49 19, WhatsApp +34 648 25 60 22, or info@hotelhurricane.com."],"The same questions come in every day, and the hotel already has the answers written down. The app gives them in a second."],
